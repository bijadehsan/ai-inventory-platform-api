[project]
name = "backend"
version = "0.1.0"
description = "AI-native Inventory & Operations Platform: backend API"
readme = "README.md"
authors = [
    { name = "Ehsan Bijad", email = "95459326+bijadehsan@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: unused imports, undefined names
    "I",    # isort: import order
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern Python syntax
    "N",    # pep8 naming
    "SIM",  # simplifications
]

[tool.mypy]
strict = true
files = ["src", "tests"]
